name: Dong bo danh ba tu Google Sheet

# Tu dong chay moi 30 phut: doc Sheet danh ba -> cap nhat staff_directory + profiles.
# Chay tay: Actions -> chon workflow -> Run workflow.
# Can secret SUPABASE_SERVICE_ROLE_KEY (repo Settings -> Secrets and variables -> Actions).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dong bo danh ba
        run: node scripts/sync-directory.js
        env:
          SHEET_ID: 1rib5XTfdOqS3z9fz32A2HB-3xKPPPH27svPMJ0rj_Ys
          SHEET_TAB: Data E-Learning
          SUPABASE_URL: https://lmcqcdpzgbdxntwodjed.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
